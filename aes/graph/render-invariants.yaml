# Island Graph — the render fidelity claims, in the GMIF v2 schema.
#
# The plan is the map and the pixels decide. Every claim here is something a
# measurement in this project produced, and the audit trail for each is a
# content-addressed chunk under `aes/raw/`, so a claim cannot be reworded without
# its evidence changing name.
#
# The island is satisfiable. It was not: it asserted the project's intent, "every
# entity in a room draws something", and the measurement that refuted it, and Z3
# returned the core `(a_every_entity_visible a_intent_is_false)`. The switch was
# drawn under a conveyor; `PuzzleEntity.renderPriority` put the belt first. A node
# that says a closed defect is still open would be the one thing this file exists
# to prevent, so the refuting node is gone rather than demoted.

artifact: render-invariants
version: 2
notes: >
  Claims about how a Head over Heels room is drawn and ordered. Validated by
  `make gmif-check`, which is `scripts/gmif_check.py` and not the skill's
  `gmif-check.sh` — the skill's reports SAT on files Z3 rejects, which is recorded
  in the tooling-integrity island.

