name: knightlore
description: Knight Lore as a second example game built on the reusable iso_core runtime.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flame: ^1.38.2
  flame_audio: ^2.0.0
  flutter:
    sdk: flutter
  iso_core:
    path: ../../packages/iso_core
  vector_math: ^2.1.4
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # BEGIN GENERATED ASSETS
    - assets/audio/
    - assets/sprites/
    - assets/sprites/knights/
    - assets/sprites/props/
    - assets/world/
    - assets/world/rooms/castle/
    - assets/world/rooms/cauldron/
    - assets/world/rooms/jungle/
    - assets/world/rooms/mine/
    - assets/world/rooms/tower/
    - assets/world/tiles/
# END GENERATED ASSETS
