name: headoverheels
description: "A modern Android port of the classic 1987 isometric puzzle-platformer 'Head over Heels'. Features dual-character mechanics, 5 planets, 21 rooms, and touch-optimized controls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine for Flutter - provides game loop, components, input handling
  flame: ^1.17.0
  flame_tiled: ^1.0.0
  flame_audio: ^1.0.0

  # State management - compile-safe, testable, scoped providers
  flutter_riverpod: ^2.5.1

  # Immutable data classes with pattern matching
  freezed_annotation: ^2.4.4

  # JSON serialization
  json_annotation: ^4.9.0

  # Audio playback
  just_audio: ^0.9.36

  # Vector math for isometric calculations
  vector_math: ^2.1.0

  # Persistent preferences
  shared_preferences: ^2.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for freezed
  freezed: ^2.5.2
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

  # Riverpod testing utilities
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/levels/tilesets/
    - assets/levels/rooms/
    - assets/levels/world.json
    - assets/audio/