name: iso_editor
description: Map editor, sprite browser and asset importer for projects powered by iso_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  iso_core:
    path: ../iso_core
  path: ^1.9.0
  vector_math: ^2.1.0
  xml: ^6.6.1
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Every icon in the editor is a Material one. Without this the font is not
  # bundled and each of them renders as an empty box: the editor looked broken in
  # a release build and fine in a debug one, which is the only way it had ever
  # been run.
  uses-material-design: true
