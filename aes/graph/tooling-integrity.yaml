# Island Graph — the epistemic tooling's own claims.
#
# Every gate in this project has, at some point, reported success while proving
# nothing. That is not bad luck; it is the default failure mode of a check that
# was written once and trusted. This island records the three cases where the
# *skill's* own instrumentation did it, because a gate that cannot fail is worse
# than no gate -- it manufactures green and is trusted exactly when nobody is
# looking.
#
# It is satisfiable. Each claim below is falsified *and* replaced by a working
# gate, which is the only honest way to close one: assert what is now true, with
# the measurement that made the old claim false in `source_chunks`.

