    - assets/levels/rooms/egyptus/
    - assets/levels/rooms/penitentiary/
    - assets/levels/rooms/safari/
    - assets/levels/tilesets/
    - assets/sprites/
    - assets/sprites/characters/duo/
    - assets/sprites/characters/head/
    - assets/sprites/characters/head/frames/
    - assets/sprites/characters/heels/
    - assets/sprites/characters/heels/frames/
    - assets/sprites/entities/bag/
    - assets/sprites/entities/conveyor/
    - assets/sprites/entities/crown/
    - assets/sprites/entities/door/
